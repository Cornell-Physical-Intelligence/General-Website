name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify application draft recovery and success confirmation
        run: node scripts/test-interest-draft.mjs
      - name: Verify the committed Pages build is current
        run: git diff --exit-code -- docs
